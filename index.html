<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover: na telefonech s výřezem se plátno roztáhne i pod něj, jinak
         zůstanou po stranách černé pruhy a hra je ještě menší (odsazení řeší safe-area). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bang! Online Prototyp</title>
    <!-- Ikona v záložce. .ico nese 16/32/48 a leží na /favicon.ico, kam si prohlížeč
         sáhne sám i bez tohoto odkazu; PNG je pro moderní prohlížeče a plochu iOS.
         Generuje je tools/favicon.js z písmene B v logu hry. -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Oswald:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <!-- Nové menu v HTML nad plátnem (view/menuDom.js, plán docs/menu-ui-plan.md). -->
    <link rel="stylesheet" href="view/menu.css">
    <style>
        /* 100dvh = výška BEZ lišty prohlížeče, která se na mobilu vysouvá; se 100vh
           plátno přetékalo a spodní pás (moje ruka) končil pod lištou. Řádek se 100vh
           zůstává jako fallback pro starší prohlížeče. */
        body { margin: 0; background-color: #100d14; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        body { height: 100dvh; overscroll-behavior: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        canvas { border: 3px solid #8a6d1f; border-radius: 12px; box-shadow: 0 0 32px rgba(0,0,0,0.6); }
        /* Malý / dotykový displej: rám ukusuje z výšky plátna (3 px rámu = 8 design px)
           a ve fullscreenu působí divně. */
        @media (max-width: 900px), (pointer: coarse) {
            canvas { border: 0; border-radius: 0; box-shadow: none; }
        }
    </style>
</head>
